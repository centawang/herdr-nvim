name: release
on:
  workflow_call:
    inputs:
      tag:
        description: "Tag to build and attach binaries to (e.g. v0.2.1)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and attach binaries to (e.g. v0.2.1)"
        required: true
        type: string
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      # Pinned, not `stable`: on macOS `stable` means `brew install neovim`,
      # and Homebrew no longer ships bottles for the macos-13/14 runners, so it
      # builds from source and fails at `brew link` (v1.2.0 shipped without
      # macOS binaries). A pinned version downloads Neovim's own release
      # tarball on every OS instead.
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: v0.12.5
      - run: rustup target add ${{ matrix.target }}
      # Short TMPDIR: test sandboxes put nvim listen sockets under the temp
      # dir, and macOS's default /var/folders/... TMPDIR can push them past
      # the 104-byte sun_path limit, which nvim >= 0.12.5 rejects.
      - run: cargo test
        env:
          TMPDIR: ${{ runner.temp }}
      - run: nvim --headless --noplugin -u NONE -l tests/run.lua
      - run: cargo build --release --target ${{ matrix.target }}
      - run: cp target/${{ matrix.target }}/release/herdr-nvim herdr-nvim-${{ matrix.target }}
      # The Herdr app's install (the root install.sh downloads it): the same
      # binary with its Lua and the app's mods, and its SHA-256.
      - run: herdr-app/bundle.sh target/${{ matrix.target }}/release/herdr-nvim ${{ matrix.target }} .
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            herdr-nvim-${{ matrix.target }}
            herdr-nvim-app-${{ matrix.target }}.tar.gz
            herdr-nvim-app-${{ matrix.target }}.tar.gz.sha256

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: v0.12.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Required native tools (fail, never silently skip)
        shell: pwsh
        run: |
          'cargo','rustc','nvim','git','node','powershell.exe' | ForEach-Object { Get-Command $_ -ErrorAction Stop | Out-Null }
          nvim --version
      - run: cargo test --locked
      - run: nvim --headless --noplugin -u NONE -l tests/run.lua
      - run: node herdr-app/e2e/js-checks.mjs
      - run: node herdr-app/e2e/windows-paths.mjs
      - run: cargo build --locked --release --target x86_64-pc-windows-msvc
      - name: Native installer smoke
        run: ./tests/windows-install.ps1 -Binary ./target/x86_64-pc-windows-msvc/release/herdr-nvim.exe
      - name: Package native binary and desktop bundle
        shell: pwsh
        run: |
          $name = 'herdr-nvim-x86_64-pc-windows-msvc.exe'
          Copy-Item target/x86_64-pc-windows-msvc/release/herdr-nvim.exe $name
          $hash = (Get-FileHash $name -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$name.sha256", "$hash  $name`n")
          ./herdr-app/bundle.ps1 -Binary $name
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            herdr-nvim-x86_64-pc-windows-msvc.exe
            herdr-nvim-x86_64-pc-windows-msvc.exe.sha256
            herdr-nvim-app-x86_64-pc-windows-msvc.zip
            herdr-nvim-app-x86_64-pc-windows-msvc.zip.sha256
